<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RevLine Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050505}#bg{position:fixed;inset:0}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.card{width:min(1000px,92vw);padding:40px;border-radius:24px;background:rgba(20,20,20,.35);backdrop-filter:blur(18px);color:#fff}</style>
</head><body><div id="bg"></div><div class="overlay"><div class="card"><h1 class="text-5xl font-bold">REVLINE</h1><p>Procedural Three.js hex background demo.</p></div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
camera.position.set(0,14,24);const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);document.getElementById('bg').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.8));const light=new THREE.PointLight(0xff2222,200);light.position.set(0,30,0);scene.add(light);
function hex(r){const s=new THREE.Shape();for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*r,y=Math.sin(a)*r;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();return s;}
const mat=new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:.9,roughness:.3});const g=new THREE.Group();scene.add(g);
for(let r=-12;r<12;r++)for(let c=-12;c<12;c++){const geo=new THREE.ExtrudeGeometry(hex(.8),{depth:1+Math.random()*3,bevelEnabled:false});geo.rotateX(Math.PI/2);const m=new THREE.Mesh(geo,mat);m.position.set(c*1.6+(r%2?.8:0),0,r*1.4);g.add(m);}
function a(){requestAnimationFrame(a);g.rotation.y+=0.001;renderer.render(scene,camera)}a();
</script></body></html>
