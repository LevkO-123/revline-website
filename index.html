<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REVLINE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050505;font-family:Inter,sans-serif}
#bg{position:fixed;inset:0}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(1100px,95vw);padding:40px;border-radius:30px;background:rgba(15,15,15,.35);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
<div id="bg"></div>
<div class="overlay"><div class="card">
<nav class="flex justify-between items-center mb-12">
<div class="text-3xl font-bold">REVLINE</div>
<div class="hidden md:flex gap-8"><a>Home</a><a>Features</a><a>Pricing</a><a>Contact</a></div>
</nav>
<h1 class="text-6xl font-black">Advanced Diagnostics</h1>
<p class="mt-4 text-gray-300">Mobile diagnostics, programming and repair.</p>
<div class="mt-8 flex gap-4"><button class="bg-red-600 px-6 py-3 rounded-xl">Get Started</button><button class="border px-6 py-3 rounded-xl">View Demo</button></div>
</div></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
camera.position.set(0,14,24);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('bg').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.8));
const pl=new THREE.PointLight(0xff2222,200);pl.position.set(0,30,0);scene.add(pl);
function hex(r){const s=new THREE.Shape();for(let i=0;i<6;i++){let a=i*Math.PI/3,x=Math.cos(a)*r,y=Math.sin(a)*r;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();return s;}
const mat=new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:.9,roughness:.3});
const g=new THREE.Group();scene.add(g);const items=[];
for(let r=-18;r<18;r++)for(let c=-18;c<18;c++){let h=1+Math.random()*4;const geo=new THREE.ExtrudeGeometry(hex(.8),{depth:h,bevelEnabled:false});geo.rotateX(Math.PI/2);const m=new THREE.Mesh(geo,mat);m.position.set(c*1.6+(r%2?.8:0),-h/2,r*1.4);g.add(m);items.push([m,h,Math.random()*10]);}
let mx=0,my=0;addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function a(t){requestAnimationFrame(a);items.forEach(v=>v[0].position.y=-v[1]/2+Math.sin(t*0.0005+v[2])*.15);g.rotation.z=mx*.15;g.rotation.x=-.45+my*.08;camera.position.x+=(mx*6-camera.position.x)*.03;camera.lookAt(0,0,0);renderer.render(scene,camera)}a(0);
</script>
</body></html>
